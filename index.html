<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name=""viewport" content="width=device-width, intial-scale=1.0"/>
        <title>Finance Chatbot</title>
        <link rel="stylesheet" href="style.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    </head>
   <body>
     
    <div id="chat-container">
        <div id="chat-header">
      <div class="avatar">💰</div>
      <div class="info">
        <h3>Finance Assistant</h3>
        
      </div>
    </div>

    <div id="chat-messages"></div>

    <div class="suggestions">
      <button class="suggestion-btn">📈 Best revenue 2024?</button>
      <button class="suggestion-btn">💰 Compare profits</button>
      <button class="suggestion-btn">🚀 Tesla investment?</button>
      <button class="suggestion-btn">📊 Microsoft growth?</button>
    </div>

    <div id="chat-input-area">
    <label for="file-upload" id="upload-btn" title="Upload financial file">📎</label>
    <input type="file" id="file-upload" accept=".xlsx,.csv" style="display:none" />
    <input type="text" id="user-input" placeholder="Ask me anything about your finances..." />
    <button id="send-btn">Send</button>
    </div>

  </div>

    <script src="app.js"></script>
   </body>
